description: The GroupCart desktop app in your browser. `groupcart workbench` serves the desktop interface through the GroupCart dashboard, for headless servers, VPSes and tablets. Disclosure — community plugin, not a Nous product. On the first `groupcart workbench` run and again after each GroupCart update it runs `npm install --ignore-scripts` (guided by GroupCart's lockfile) and Vite against your GroupCart checkout's desktop sources, writing only under ~/.groupcart/groupcart-workbench and its own plugin dir (the checkout is only read), and starts `groupcart dashboard` on loopback when none is running.
